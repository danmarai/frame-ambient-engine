<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame · Home gallery</title><link rel="stylesheet" href="/style.css"><script src="/ui.js" defer></script><body><header><span>MARANTZ / FRAME</span><button id="logout" hidden>Sign out</button></header><main><h1>A quieter view.</h1><p class="intro">Nature for your Frame. Choose a photograph, then bring it home.</p><form id="login"><label for="key">Your private access key</label><div class="row"><input id="key" type="password" autocomplete="current-password" required><button>Enter gallery</button></div></form><p id="message" role="status"></p><section id="gallery" hidden><div class="row"><p id="bridge"></p><label class="upload">Add artwork<input id="upload" type="file" accept="image/png,image/jpeg,image/webp"></label></div><p class="hint">Upload an image generated with your subscription or your own photograph. Images are fitted to the TV’s 16:9 canvas. The laptop bridge must be awake and on the TV’s network to change artwork.</p><div id="images"></div></section></main></body></html>
